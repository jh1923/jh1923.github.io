<div id="banner">
  <span id="logo"></span>
  {% include banner-link.html text="home" url="/" page_match="/" %}
  {% include banner-link.html text="about" url="/about" page_match="/about/" %}
  {% include banner-link.html text="blog" url="/blog" page_match="/blog/" %}
  <a href="https://github.com/jh1923" class="banner-link">github</a>
  {% if include.show_downloads %}
  <div class="downloads">
    <span>Downloads:</span>
    <ul>
      <li><a href="{{ site.github.zip_url }}" class="button">ZIP</a></li>
      <li><a href="{{ site.github.tar_url }}" class="button">TAR</a></li>
    </ul>
  </div>
  {% endif %}
</div><!-- end banner -->
